# ============================================================
# nowen-video 开箱即用部署 compose（生产 / NAS / 普通 Linux / ARM SBC）
# ============================================================
# 快速开始：
#   1. 复制本文件到你的部署目录；
#   2. 按下文注释改挂载路径（媒体目录、数据目录）；
#   3. docker compose up -d
#   4. 浏览器访问 http://<host>:8080  →  注册第一个账号（自动成为管理员）。
#
# 镜像默认从 Docker Hub 拉取（manifest list 自动选 amd64 / arm64）。
# 如需自行从源码构建，见文末「自行构建」注释。
# ============================================================
version: '3.8'

services:
  nowen-video:
    # ---- 镜像：默认拉取预构建版 ----
    image: cropflre/nowen-video:latest
    # 如需锁定版本：
    # image: cropflre/nowen-video:v1.2.0
    # 如需自行从源码构建（取消下行，并在文末 build 段取消注释）：
    # build: .

    container_name: nowen-video

    # ---- 端口 ----
    # Web / API 端口
    ports:
      - "8080:8080"

    # ---- 权限：容器内以 root 运行，规避 NAS 挂载目录 UID/GID 不一致 ----
    user: "0:0"
    # PUID / PGID / UMASK 在下方统一的 environment 块中设置（勿重复声明 environment）。

    # ---- 持久化与媒体卷 ----
    volumes:
      # 数据持久化（SQLite、上传、配置等，必须可写）
      - ./data:/data
      # 转码缓存（HLS 分片等，必须可写）
      - ./cache:/cache
      # ---- 媒体目录挂载（只读 :ro；按你的实际 NAS/主机路径修改，可挂多个）----
      # 示例：挂整个媒体根目录
      - /volume1/Media:/media:ro
      # 示例：分目录挂（电影 / 电视剧 / 动漫）
      # - /volume1/Media/电影:/media/电影:ro
      # - /volume1/Media/电视剧:/media/电视剧:ro
      # - /volume1/Media/动漫:/media/动漫:ro

      # ---- 自定义 ffmpeg / ffprobe（可选，一般不需要）----
      # 基础镜像已经经 apk 内置了 ffmpeg / ffprobe（默认在 /usr/bin/ffmpeg、
      # /usr/bin/ffprobe，PATH 内可直接调用）。仅当你想换成自己编译或第三方的
      # ffmpeg / ffprobe 时，才取消下面两行注释，并同步打开下方对应的
      # NOWEN_APP_FFMPEG_PATH / NOWEN_APP_FFPROBE_PATH 环境变量。
      # 注意：这里也可以指向任意 ffmpeg 兼容的可执行文件（例如某种远程转码
      # 客户端）——由你自己挂载并配置 env 即可，本镜像不对其做专门集成。
      # - ./ffmpeg:/usr/local/bin/ffmpeg:ro
      # - ./ffprobe:/usr/local/bin/ffprobe:ro

    # ---- 硬件加速设备（按平台开启；无 GPU 可整段注释）----
    # - x86_64 Intel：/dev/dri（QSV / VAAPI）
    # - NVIDIA 主机：宿主机装好 nvidia-container-toolkit 后另配 runtime，这里挂 /dev/dri 无用
    # - ARM SBC（树莓派 / 瑞芯微）：见文末注释
    devices:
      - /dev/dri:/dev/dri
      # FUSE（WebDAV / Alist 等远程挂载需要；宿主机先 modprobe fuse）
      - /dev/fuse:/dev/fuse

    environment:
      # 入口脚本做属主/权限处理（与上方 user: "0:0" 一致）
      - PUID=0
      - PGID=0
      - UMASK=000

      - NOWEN_APP_PORT=8080
      - NOWEN_APP_DATA_DIR=/data
      - NOWEN_APP_WEB_DIR=/app/web/dist
      - NOWEN_DATABASE_DB_PATH=/data/nowen.db
      - NOWEN_CACHE_CACHE_DIR=/cache
      - NOWEN_LOGGING_LEVEL=info

      # ---- ffmpeg / ffprobe 可执行路径（一般留空即用镜像内置的 /usr/bin/ffmpeg）----
      # 若上面挂载了自定义 ffmpeg/ffprobe，取消注释并指到挂载点：
      # - NOWEN_APP_FFMPEG_PATH=/usr/local/bin/ffmpeg
      # - NOWEN_APP_FFPROBE_PATH=/usr/local/bin/ffprobe

      # ---- 转码硬件加速 ----
      # 解码/加速总模式：auto（自动）/ software（纯 CPU）/ hardware（强制硬件）
      - NOWEN_TRANSCODE_HW_DECODE_MODE=hardware
      # 硬件编码 API：默认 nvenc（NVIDIA）。可按显卡改为 auto / qsv(Intel) /
      # vaapi(通用/AMD) / amf(AMD Windows)。无 GPU 时把上一行改成 software。
      - NOWEN_TRANSCODE_HW_ENCODER=nvenc

      # ---- 时区 ----
      - TZ=Asia/Shanghai

    restart: unless-stopped

    # ---- 健康检查 ----
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    # ---- 资源限制（按设备内存调整；ARM 盒子可降到 1G）----
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

# ============================================================
# 超级管理员说明
# ============================================================
# 首次启动后访问 http://<host>:8080 注册的第一个账号自动成为 admin。
# 之后可在管理后台开放/关闭注册、邀请码控制普通用户。
# 把已有普通用户提权为 admin：
#   docker exec -it nowen-video sqlite3 /data/nowen.db \
#     "UPDATE users SET role='admin' WHERE username='yourname';"
# ============================================================

# ============================================================
# 自行从源码构建（可选）
# ============================================================
# 1. 取消上方 services.nowen-video.image 与 build 的注释（用 build: .）。
# 2. 在支持 buildx 的环境下：
#      docker buildx create --name nowen-builder --use
#      docker compose build
#      docker compose up -d
# ============================================================
